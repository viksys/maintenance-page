        <!-- Fonts are declared here rather than via @import in the bundled CSS.
             An @import inside index.css serialises the request chain: the browser must
             download and parse the app CSS before it discovers the font request. A
             <link> in the head is discovered by the preload scanner immediately. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <!-- TWO FAMILIES, AND THAT IS THE WHOLE TYPE SYSTEM. Inter sets every
             word on the site, headings and body alike; JetBrains Mono sets
             labels — eyebrows, nav, numerals, specs — and the hero word cycle.
             docs/TYPOGRAPHY.md has the reasoning and the per-role specs.

             This replaced six families and nineteen weight files. Chakra Petch
             was downloading with zero consumers; Outfit existed only as a
             fallback for Gilroy, a commercial licence that was never loaded, so
             every Home-page heading silently set in the fallback; and Manrope
             set the Home body while Inter set every other page's, which meant
             the body typeface changed as a visitor moved between pages.

             DO NOT ADD A FAMILY HERE without adding it to docs/TYPOGRAPHY.md
             and pointing a token at it. A face named in index.css but absent
             from this link fails silently to the next name in the stack, which
             is exactly how the Gilroy problem went unnoticed. -->

        <!-- LCP element on the homepage. Without this the image is only discovered
             after the JS bundle parses and React commits the hero.

             MEDIA, NOT imagesrcset. The hero is a <picture> that switches on a
             media query at 767px; a preload that switches on w-descriptors is
             answering a different question, and on a 393px × DPR 3 handset it
             answered it differently: the descriptor maths asked for ~1179px and
             preloaded the 1672px desktop plate (320 KB) while <picture> rendered
             the 864px portrait plate (172 KB). Both were fetched, the preloaded
             one was discarded, and the real LCP image queued behind it.

             These two links mirror the <picture> in Home.js EXACTLY. The media
             conditions must stay in step with it — that is the whole contract.
             The descriptor also claimed 1920w for a file that is 1672px wide. -->
        <link
            rel="preload"
            as="image"
            media="(max-width: 767px)"
            href="/assets/img/hero-field-mobile.webp"
            type="image/webp"
            fetchpriority="high"
        />
        <link
            rel="preload"
            as="image"
            media="(min-width: 768px)"
            href="/assets/img/hero-field.webp"
            type="image/webp"
            fetchpriority="high"
        />
